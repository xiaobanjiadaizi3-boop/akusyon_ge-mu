<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FPS アスレチックレンジ</title>
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>

    <div id="crosshair">
      <span class="ch ch-t"></span>
      <span class="ch ch-b"></span>
      <span class="ch ch-l"></span>
      <span class="ch ch-r"></span>
      <span id="hitmarker"></span>
    </div>

    <div id="hud">
      <div class="hud-left">
        <div class="hud-block">
          <span class="label">スコア</span>
          <span id="score" class="value">0</span>
        </div>
        <div class="hud-block">
          <span class="label">撃破</span>
          <span id="kills" class="value">0</span>
        </div>
        <div class="hud-block">
          <span class="label">命中率</span>
          <span id="accuracy" class="value">-</span>
        </div>
      </div>

      <div class="hud-right">
        <div id="weaponName" class="weapon-name">ハンドガン</div>
        <div id="ammo" class="ammo"><span id="magAmmo">12</span><span class="slash">/</span><span id="reserveAmmo">96</span></div>
        <div class="blink">
          <span class="label">ブリンク (Shift)</span>
          <div class="bar"><div id="blinkFill"></div></div>
          <span id="blinkText" class="blink-text">READY</span>
        </div>
      </div>
    </div>

    <div id="weaponWheel"></div>

    <div id="log"></div>

    <div id="overlay">
      <div class="card">
        <h1>FPS アスレチックレンジ</h1>
        <p class="sub">遮蔽物とジャンプ台のコースでダミーを撃ち抜け。</p>
        <ul class="keys">
          <li><b>W A S D</b><span>移動</span></li>
          <li><b>Space</b><span>ジャンプ</span></li>
          <li><b>Shift</b><span>ブリンク（クールタイム）</span></li>
          <li><b>Enter</b><span>射撃（マウス左も可）</span></li>
          <li><b>/</b><span>武器切替（1〜4も可）</span></li>
          <li><b>R</b><span>リロード</span></li>
          <li><b>Esc</b><span>マウス解放</span></li>
        </ul>
        <button id="startBtn">クリックで開始</button>
        <p class="note">画面をクリックするとマウスロックされ、視点操作ができます。</p>
      </div>
    </div>
  </div>

  <script type="module" src="fps.js"></script>
</body>
</html>
