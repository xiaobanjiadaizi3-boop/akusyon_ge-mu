<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WASD vs 矢印キー 1vs1ミニゲーム集</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Keyboard Duel</p>
      <h1>1vs1 ミニゲーム集</h1>
    </div>
    <div class="scoreboard">
      <span class="p1">P1 (WASD) <b id="scoreP1">0</b></span>
      <span class="vs">-</span>
      <span class="p2"><b id="scoreP2">0</b> P2 (↑↓←→)</span>
    </div>
  </header>

  <main class="stage">
    <canvas id="game" width="900" height="600"></canvas>
    <div id="overlay" class="overlay"></div>
  </main>

  <footer class="hint">
    P1: <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / P2: <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> /
    メニュー: <kbd>1</kbd>-<kbd>6</kbd> でゲーム選択, <kbd>Space</kbd> 決定 / <kbd>Esc</kbd> メニューへ
  </footer>

  <script src="app.js"></script>
</body>
</html>
